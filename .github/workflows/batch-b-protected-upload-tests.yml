name: batch-b-protected-upload-tests
on:
  push:
    branches:
      - 'review/batch-b-protected-garage-uploads'
  pull_request:
    paths:
      - 'tests/test_protected_garage_upload.py'
      - '.github/workflows/batch-b-protected-upload-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==9.1.1 boto3==1.43.107 pyarrow==23.0.1 python-dotenv==1.2.4
      - name: Run batch regression tests
        run: python -m pytest -q tests/test_protected_garage_upload.py
