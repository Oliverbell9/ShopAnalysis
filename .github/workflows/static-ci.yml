name: ShopAnalysis Static and Synthetic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Python, dbt, and synthetic data validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            dbt-core==1.12.0 \
            dbt-duckdb==1.11.0

      - name: Validate Python syntax
        run: |
          python scripts/validate_python_syntax.py

      - name: Install integrated regression dependencies
        run: |
          python -m pip install \
            pytest==9.1.1 \
            boto3==1.43.107 \
            pyarrow==23.0.1 \
            python-dotenv==1.2.4

      - name: Run integrated batch regression tests
        run: |
          python -m pytest -q \
            tests/test_protected_garage_upload.py \
            tests/test_reconcile_revenue.py \
            tests/test_benchmark_local.py \
            tests/test_validate_full_olist.py \
            tests/test_validate_raw_olist.py \
            tests/test_validate_olist_csv_integrity.py \
            tests/test_validate_olist_order_lineage.py

      - name: Parse dbt project
        working-directory: dbt
        run: |
          dbt parse --no-partial-parse --profiles-dir .

      - name: Generate isolated synthetic RAW database
        run: |
          python data_gen/generate_synthetic_raw.py \
            --database data/shopanalysis_ci.duckdb

      - name: Build synthetic dbt models
        working-directory: dbt
        run: |
          dbt run \
            --profiles-dir ./ci_profiles \
            --target ci \
            --no-partial-parse

      # Full-dataset cardinality/amount assertions are not valid for the seven-order synthetic fixture.
      # Run those two separately against verified full Olist data (docs/validation.md).
      - name: Test synthetic dbt models
        working-directory: dbt
        run: |
          dbt test \
            --profiles-dir ./ci_profiles \
            --target ci \
            --exclude \
              assert_dim_customer_scd2_controls \
              assert_fct_olist_orders_delivered_metric_controls \
            --no-partial-parse

      - name: Report validation success
        run: |
          echo "ShopAnalysis static and synthetic CI completed successfully."
