name: ShopAnalysis Static and Synthetic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Python, dbt, and synthetic data validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            dbt-core==1.12.0 \
            dbt-duckdb==1.11.0

      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = [
              Path("ingestion"),
              Path("data_gen"),
              Path("analytics"),
              Path("orchestration"),
          ]

          files = sorted(
              path
              for root in roots
              if root.exists()
              for path in root.rglob("*.py")
          )

          if not files:
              raise SystemExit("FAIL: No Python files discovered")

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=str(path),
              )
              print(f"PASS: {path}")

          print(f"Python syntax validation passed: {len(files)} files")
          PY

      - name: Parse dbt project
        working-directory: dbt
        run: |
          dbt parse --no-partial-parse --profiles-dir .

      - name: Generate isolated synthetic RAW database
        run: |
          python data_gen/generate_synthetic_raw.py \
            --database data/shopanalysis_ci.duckdb

      - name: Build synthetic dbt models
        working-directory: dbt
        run: |
          dbt run \
            --profiles-dir ./ci_profiles \
            --target ci \
            --no-partial-parse

      - name: Test synthetic dbt models
        working-directory: dbt
        run: |
          dbt test \
            --profiles-dir ./ci_profiles \
            --target ci \
            --exclude \
              assert_dim_customer_scd2_controls \
              assert_fct_olist_orders_delivered_metric_controls \
            --no-partial-parse

      - name: Report validation success
        run: |
          echo "ShopAnalysis static and synthetic CI completed successfully."
