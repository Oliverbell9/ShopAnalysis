name: Batch A CI configuration validation
on:
  push:
    branches:
      - review/batch-a-ci-reproducibility
  pull_request:
    paths:
      - '.github/workflows/static-ci.yml'
      - 'scripts/validate_python_syntax.py'
      - '.github/workflows/batch-a-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Check workflow YAML structure
        run: |
          python -c "import yaml; from pathlib import Path; d=yaml.safe_load(Path('.github/workflows/static-ci.yml').read_text()); assert isinstance(d,dict) and 'jobs' in d"
      - name: Parse Python sources
        run: python scripts/validate_python_syntax.py
