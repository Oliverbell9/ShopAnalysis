name: batch-d-benchmark-tests
on:
  push:
    branches:
      - 'review/batch-d-closure-evidence'
  pull_request:
    paths:
      - 'tests/test_benchmark_local.py'
      - '.github/workflows/batch-d-benchmark-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==9.1.1
      - name: Run batch regression tests
        run: python -m pytest -q tests/test_benchmark_local.py
