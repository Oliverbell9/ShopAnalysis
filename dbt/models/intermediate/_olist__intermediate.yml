version: 2

models:
  - name: int_olist__order_items_by_order
    description: >
      Order-level aggregation of Olist order items. One row per order_id
      appearing in the order-items source. Monetary values use exact
      fixed-point arithmetic inherited from staging.
    columns:
      - name: order_id
        description: Order identifier and model grain.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

      - name: item_count
        description: Number of order-item records associated with the order.
        data_tests:
          - not_null

      - name: distinct_product_count
        description: Number of distinct products associated with the order.
        data_tests:
          - not_null

      - name: distinct_seller_count
        description: Number of distinct sellers associated with the order.
        data_tests:
          - not_null

      - name: item_revenue
        description: Sum of item price at order grain.
        data_tests:
          - not_null
          - nonnegative

      - name: freight_revenue
        description: Sum of freight value at order grain.
        data_tests:
          - not_null
          - nonnegative

      - name: item_plus_freight
        description: Sum of item price plus freight value at order grain.
        data_tests:
          - not_null
          - nonnegative

  - name: int_olist__payments_by_order
    description: >
      Order-level aggregation of Olist payment records. One row per order_id
      appearing in the payments source.
    columns:
      - name: order_id
        description: Order identifier and model grain.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

      - name: payment_record_count
        description: Number of payment records associated with the order.
        data_tests:
          - not_null

      - name: payment_type_count
        description: Number of distinct payment types associated with the order.
        data_tests:
          - not_null

      - name: payment_value
        description: Sum of payment value at order grain.
        data_tests:
          - not_null
          - nonnegative

  - name: int_olist__reviews_by_order
    description: >
      Order-level aggregation of Olist review records. One row per order_id
      appearing in the reviews source.
    columns:
      - name: order_id
        description: Order identifier and model grain.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

      - name: review_record_count
        description: Number of review records associated with the order.
        data_tests:
          - not_null

      - name: distinct_review_count
        description: Number of distinct review identifiers associated with the order.
        data_tests:
          - not_null

      - name: minimum_review_score
        description: Minimum review score associated with the order.
        data_tests:
          - not_null

      - name: maximum_review_score
        description: Maximum review score associated with the order.
        data_tests:
          - not_null

      - name: average_review_score
        description: Arithmetic mean of review scores associated with the order.
        data_tests:
          - not_null

  - name: int_olist__orders_enriched
    description: >
      Canonical order-grain intermediate model built from the complete Olist
      order spine and enriched with customer identity, geography, independently
      aggregated order items, payments, and reviews. Child aggregates are joined
      with left joins to preserve every source order and prevent fanout.
    columns:
      - name: order_id
        description: Order identifier and model grain.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Transactional customer identifier associated with the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id

      - name: customer_unique_id
        description: >
          Persistent customer identifier carried from the customer source for
          cross-order customer analysis.
        data_tests:
          - not_null

      - name: order_status
        description: Source order status.
        data_tests:
          - not_null

      - name: order_purchased_at
        description: Timestamp at which the order was purchased.
        data_tests:
          - not_null

      - name: item_revenue
        description: >
          Sum of item prices when item records exist. Null when the order has
          no corresponding item records. This field is not yet designated as
          the authoritative revenue metric.

      - name: freight_revenue
        description: >
          Sum of freight values when item records exist. Null when the order
          has no corresponding item records.

      - name: item_plus_freight
        description: >
          Sum of item prices and freight values when item records exist.
          This field is retained for reconciliation and is not yet designated
          as the authoritative revenue metric.

      - name: payment_value
        description: >
          Sum of payment values when payment records exist. Null when the order
          has no corresponding payment records. This field is retained for
          reconciliation and is not yet designated as the authoritative
          revenue metric.
